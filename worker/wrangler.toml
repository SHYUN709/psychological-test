name = "wpi-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# API 키는 여기 쓰지 말고: npx wrangler secret put ANTHROPIC_API_KEY

[vars]
# 쉼표로 여러 개. 끝에 / 없이, 프로토콜까지 정확히.
ALLOWED_ORIGINS = "https://shyun709.github.io"
DAILY_LIMIT_PER_IP = "10"   # IP당 하루 호출 수 (질문 1회 + 해석 1회 = 2회)
DAILY_LIMIT_GLOBAL = "300"  # 전체 하루 호출 수 (비용 상한 안전장치)
MODEL = "claude-opus-5-5"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "PUT-YOUR-KV-NAMESPACE-ID-HERE"
