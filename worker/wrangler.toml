name = "wpi-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# API 키는 여기 쓰지 말고: npx wrangler secret put GEMINI_API_KEY

[vars]
# 쉼표로 여러 개. 끝에 / 없이, 프로토콜까지 정확히.
ALLOWED_ORIGINS = "https://shyun709.github.io"
DAILY_LIMIT_PER_IP = "10"   # IP당 하루 호출 수 (질문 1회 + 해석 1회 = 2회)
DAILY_LIMIT_GLOBAL = "300"  # 전체 하루 호출 수 (비용 상한 안전장치)
MODEL = "gemini-3.8-flash"  # Google AI Studio 무료 등급 모델
FALLBACK_MODEL = "gemini-3.5-flash-lite"  # MODEL이 붐비거나(503) 한도(429)일 때

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "f1d82a3ee5fa4e6f8bce068cc9b0166f"

# 지난 요청 로그를 대시보드(Workers → wpi-ai-proxy → Logs)에서 볼 수 있게
[observability]
enabled = true
